<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <title>ResusBay</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    body {
      padding: 8px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #185fa7;
      color: white;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }

    .logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      padding: 3px;
      flex-shrink: 0;
    }

    .title-block {
      min-width: 0;
    }

    .title {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1;
      margin: 0;
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.95;
      margin-top: 4px;
    }

    .info-box {
      background-color: #f0f7ff;
      border-left: 4px solid #0066cc;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 1rem;
      color: #1a1a1a;
      border-radius: 0 6px 6px 0;
    }

    .container {
      width: 100%;
      max-width: 100%;
      max-height: 95vh;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    rect {
      transition: fill 0.2s;
    }

    @media (max-width: 480px) {
      body {
        padding: 6px;
      }

      .top-bar {
        padding: 8px 10px;
      }

      .logo {
        width: 46px;
        height: 46px;
      }

      .title {
        font-size: 1.45rem;
      }

      .subtitle {
        font-size: 0.82rem;
      }

      .info-box {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

<header class="top-bar">
  <img src="logo.png" alt="ResusPro logo" class="logo">
  <div class="title-block">
    <h1 class="title">ResusBay</h1>
    <div class="subtitle">Interactive equipment location guide</div>
  </div>
</header>

<div class="info-box">
  ℹ️ <strong>Interactive Photo:</strong> Click on the different items in the bay below to open their specific checklists.
</div>

<div class="container">

  <svg viewBox="0 0 1920 1080" width="100%" height="100%">

    <image href="bay1.jpeg" width="1920" height="1080" x="0" y="0" />

    <a href="https://tinyurl.com/yjskvhmm" target="_blank" style="cursor: pointer;">
      <title>Open Bay Checklist</title>
      <rect x="0" y="0" width="1920" height="1080"
            fill="transparent" stroke="transparent" stroke-width="1"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.15)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/4uhh8rra" target="_blank" style="cursor: pointer;">
      <title>Open Airway and Breathing Trolley Checklist</title>
      <rect x="288" y="432" width="269" height="324"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/3ffnt5wy" target="_blank" style="cursor: pointer;">
      <title>Open Circulation and Monitoring Checklist</title>
      <rect x="864" y="302" width="192" height="302"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/yrjvk4u3" target="_blank" style="cursor: pointer;">
      <title>Open Panda Checklist</title>
      <rect x="1190" y="162" width="192" height="486"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/4bufdw3a" target="_blank" style="cursor: pointer;">
      <title>Open Sideboard Checklist</title>
      <rect x="1363" y="432" width="557" height="518"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/mrpt96sz" target="_blank" style="cursor: pointer;">
      <title>Open HALO Trolley Checklist</title>
      <rect x="154" y="486" width="76" height="410"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/mrpt96sz" target="_blank" style="cursor: pointer;">
      <title>Open HALO Trolley Checklist</title>
      <rect x="0" y="486" width="192" height="86"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/472sp57s" target="_blank" style="cursor: pointer;">
      <title>Open Access Trolley Checklist</title>
      <rect x="0" y="583" width="154" height="486"
            fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

  </svg>

</div>

</body>
</html>
