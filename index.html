<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <title>ResusBay</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    body {
      height: 100vh;
      height: 100svh;
      padding: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, #003f8c, #1565c0);
      color: white;
      border-radius: 10px;
      padding: 10px 16px 12px 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
      flex: 0 0 auto;
      min-height: 76px;
      overflow: visible;
    }

    .logo {
      width: clamp(120px, 12vw, 190px);
      max-width: 28vw;
      height: auto;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .title-block {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: baseline;
      gap: 16px;
      white-space: nowrap;
      overflow: visible;
    }

    .title {
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 900;
      line-height: 1.28;
      margin: 0;
      padding-bottom: 2px;
      letter-spacing: -0.03em;
      flex: 0 0 auto;
    }

    .subtitle {
      font-size: clamp(0.95rem, 1.2vw, 1.25rem);
      font-weight: 700;
      opacity: 0.96;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .subtitle-mobile {
      display: none;
    }

    .container {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      flex: 1 1 auto;
    }

    rect {
      transition: fill 0.2s;
    }

    @media (max-width: 650px) {
      body {
        height: auto;
        min-height: 100svh;
        padding: 8px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        overflow: auto;
      }

      .top-bar {
        display: grid;
        grid-template-columns: 26vw 1fr;
        grid-template-rows: auto auto;
        column-gap: 8px;
        row-gap: 0;
        align-items: center;
        padding: 9px 10px 10px 10px;
        margin-bottom: 8px;
        border-radius: 9px;
        min-height: 72px;
      }

      .logo {
        grid-row: 1 / 3;
        grid-column: 1;
        width: 100%;
        max-width: none;
      }

      .title-block {
        grid-column: 2;
        display: block;
        min-width: 0;
        overflow: visible;
      }

      .title {
        font-size: clamp(2rem, 8.8vw, 2.6rem);
        line-height: 1.18;
        padding-bottom: 2px;
        overflow: visible;
        text-overflow: clip;
      }

      .subtitle {
        font-size: clamp(0.86rem, 3.35vw, 1rem);
        line-height: 1.12;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }

      .subtitle-desktop {
        display: none;
      }

      .subtitle-mobile {
        display: block;
      }

      .container {
        flex: 0 0 auto;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 0;
        height: auto;
        align-items: flex-start;
      }

      svg {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    }

    @media (max-width: 380px) {
      .top-bar {
        grid-template-columns: 25vw 1fr;
        padding: 8px 9px 9px 9px;
      }

      .title {
        font-size: clamp(1.65rem, 8vw, 2rem);
      }

      .subtitle {
        font-size: clamp(0.74rem, 3.1vw, 0.88rem);
      }
    }
  </style>
</head>

<body>

<header class="top-bar">
  <img src="logo-tight.png" alt="ResusPro logo" class="logo">
  <div class="title-block">
    <h1 class="title">ResusBay</h1>
    <div class="subtitle subtitle-desktop">Interactive equipment guide - click on items to review contents.</div>
    <div class="subtitle subtitle-mobile">Tap items to review contents.</div>
  </div>
</header>

<div class="container">

  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMin meet">

    <image href="bay1.jpeg" width="1920" height="1080" x="0" y="0" />

    <a href="https://tinyurl.com/yjskvhmm" target="_blank" style="cursor: pointer;">
      <title>Open Bay Checklist</title>
      <rect x="0" y="0" width="1920" height="1080" fill="transparent" stroke="transparent" stroke-width="1"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.15)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/4uhh8rra" target="_blank" style="cursor: pointer;">
      <title>Open Airway and Breathing Trolley Checklist</title>
      <rect x="288" y="432" width="269" height="324" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/3ffnt5wy" target="_blank" style="cursor: pointer;">
      <title>Open Circulation and Monitoring Checklist</title>
      <rect x="864" y="302" width="192" height="302" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/yrjvk4u3" target="_blank" style="cursor: pointer;">
      <title>Open Panda Checklist</title>
      <rect x="1190" y="162" width="192" height="486" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/4bufdw3a" target="_blank" style="cursor: pointer;">
      <title>Open Sideboard Checklist</title>
      <rect x="1363" y="432" width="557" height="518" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/mrpt96sz" target="_blank" style="cursor: pointer;">
      <title>Open HALO Trolley Checklist</title>
      <rect x="154" y="486" width="76" height="410" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/mrpt96sz" target="_blank" style="cursor: pointer;">
      <title>Open HALO Trolley Checklist</title>
      <rect x="0" y="486" width="192" height="86" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

    <a href="https://tinyurl.com/472sp57s" target="_blank" style="cursor: pointer;">
      <title>Open Access Trolley Checklist</title>
      <rect x="0" y="583" width="154" height="486" fill="transparent" stroke="transparent" stroke-width="2"
            onmouseover="this.setAttribute('fill', 'rgba(0, 102, 204, 0.3)')"
            onmouseout="this.setAttribute('fill', 'transparent')" />
    </a>

  </svg>

</div>

</body>
</html>
